<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>オリジナルボードゲーム</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,"Noto Sans JP",sans-serif;max-width:650px;margin:20px auto;padding:0 14px;color:#171717}h1{font-size:25px}.muted{color:#666;font-size:13px}.panel,.status,details{border:1px solid #ddd;border-radius:13px;padding:13px;margin:13px 0}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}button{font:inherit;border:1px solid #ccc;border-radius:9px;background:white;padding:10px;cursor:pointer}.active,.primary{background:#171717;color:white}.primary{width:100%;border:0;font-weight:700}.legend{display:flex;justify-content:space-between;margin:14px 2px}.legend span{display:flex;align-items:center;gap:7px;font-weight:650}.dot{width:11px;height:11px;border-radius:50%}.blue{background:#2563eb}.red{background:#dc2626}.boardwrap{border:1px solid #ddd;border-radius:13px;padding:8px}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.cell{aspect-ratio:1;border:0;border-radius:4px;padding:0;display:grid;place-items:center;min-width:0}.light{background:#e8e8e8}.dark{background:#cfcfcf}.goal{background:#fde68a}.selected{outline:3px solid #111827;outline-offset:-3px}.piece{width:70%;height:70%;border-radius:50%}.a{background:#2563eb}.b{background:#dc2626}.move{width:10px;height:10px;border-radius:50%;background:#16a34a}.status{background:#f4f4f5}.primary{padding:13px}details ul{font-size:14px;line-height:1.7;padding-left:20px}@media(max-width:420px){body{margin:12px auto}.board{gap:3px}}
</style>
<body>
<h1>対戦モード</h1><p class="muted">駒を選ぶと、その駒の移動先だけに緑の小さな丸が表示されます。</p>
<section class="panel"><b>対戦設定</b><div>対戦形式</div><div class="controls" id="m"><button class="active" data-v="ai">1人 vs AI</button><button data-v="two">2人対戦</button></div>
<div id="hs"><div>自分が操作する駒</div><div class="controls" id="h"><button class="active" data-v="A">A（下側・青）</button><button data-v="B">B（上側・赤）</button></div></div>
<div>先手</div><div class="controls" id="f"><button class="active" data-v="A">A（青）</button><button data-v="B">B（赤）</button></div><button class="primary" id="start">対戦開始・設定を反映</button></section>
<div class="legend"><span><i class="dot blue"></i>A（青） <small id="ga">目標 0/4</small></span><span><i class="dot red"></i>B（赤） <small id="gb">目標 0/4</small></span></div>
<div class="boardwrap"><div class="board" id="board"></div></div>
<div class="status"><b id="msg">対戦開始を押してください</b><div class="muted" id="info">手数：0</div><div class="muted" id="sel"></div></div>
<button id="restart">最初からやり直す</button>
<details><summary>ルール説明</summary><ul><li>自分の駒を相手側へ同じ列で1マス進めます。</li><li>前に相手の駒があり、その先が空いていれば2マス跳び越せます。跳び越された駒は残ります。</li><li>横・斜め・後ろには進めません。</li><li>相手側の一番奥に着いた駒は動けなくなります。</li><li>先に4個の駒を相手側の一番奥へ到達させた側が勝ちです。</li><li>動ける駒がなければパス。両者とも動けなければ引き分けです。</li></ul></details>
<script>
const $=x=>document.getElementById(x),other=p=>p==="A"?"B":"A";
let mode="ai",human="A",first="A",b={A:Array(6).fill(5),B:Array(6).fill(0)},turn="A",chosen=null,started=false,done=false,count=0,seed=20261107,busy=false;
function moves(x,p){let out=[],o=other(p),d=p==="A"?-1:1,g=p==="A"?0:5;for(let c=0;c<6;c++){let r=x[p][c],n=r+d;if(r===g||n<0||n>5)continue;if(x[o][c]===n){let j=n+d;if(j>=0&&j<6&&x.A[c]!==j&&x.B[c]!==j)out.push({c,to:j})}else if(x.A[c]!==n&&x.B[c]!==n)out.push({c,to:n})}return out}
function apply(x,p,m){let z={A:x.A.slice(),B:x.B.slice()};z[p][m.c]=m.to;return z}
function goals(x){return {A:x.A.filter(v=>v===0).length,B:x.B.filter(v=>v===5).length}}
function result(x){let g=goals(x);if(g.A>=4)return"A";if(g.B>=4)return"B";if(!moves(x,"A").length&&!moves(x,"B").length)return"draw";return null}
function evalb(x){let g=goals(x);if(g.A>=4)return 1e6;if(g.B>=4)return-1e6;let v=g.A*10000-g.B*10000;for(let r of x.A)if(r!==0)v+=(5-r)*10;for(let r of x.B)if(r!==5)v-=r*10;let am=moves(x,"A"),bm=moves(x,"B");v+=2*(am.length-bm.length);for(let m of am)if(Math.abs(m.to-x.A[m.c])===2)v++;for(let m of bm)if(Math.abs(m.to-x.B[m.c])===2)v--;return v}
function search(x,p,d,a,z,path){let k=JSON.stringify([x.A,x.B,p]);if(path.has(k))return 0;let res=result(x);if(res)return res==="A"?1e6:res==="B"?-1e6:0;if(!d)return evalb(x);let ms=moves(x,p),np=new Set(path);np.add(k);if(!ms.length)return search(x,other(p),d-1,a,z,np);let best=p==="A"?-Infinity:Infinity;for(let m of ms){let v=search(apply(x,p,m),other(p),d-1,a,z,np);if(p==="A"){best=Math.max(best,v);a=Math.max(a,best)}else{best=Math.min(best,v);z=Math.min(z,best)}if(z<=a)break}return best}
function rng(seed){let s=BigInt(seed)&((1n<<64n)-1n);return()=>{s=(s+0x9E3779B97F4A7C15n)&((1n<<64n)-1n);let z=s;z=((z^(z>>30n))*0xBF58476D1CE4E5B9n)&((1n<<64n)-1n);z=((z^(z>>27n))*0x94D049BB133111EBn)&((1n<<64n)-1n);return z^(z>>31n)}}
function aiMove(x,p){let ms=moves(x,p);if(!ms.length)return null;let wins=ms.filter(m=>{let g=goals(apply(x,p,m));return p==="A"?g.A>=4:g.B>=4});if(wins.length)return wins[0];let gm=ms.filter(m=>p==="A"?m.to===0:m.to===5),pool=gm.length?gm:ms,sc=pool.map(m=>({m,v:search(apply(x,p,m),other(p),4,-Infinity,Infinity,new Set())})),best=p==="A"?Math.max(...sc.map(q=>q.v)):Math.min(...sc.map(q=>q.v)),cs=sc.filter(q=>p==="A"?q.v>=best-10:q.v<=best+10),r=rng(++seed),n=BigInt(cs.length),lim=(1n<<64n)-((1n<<64n)%n),v;do{v=r()}while(v>=lim);return cs[Number(v%n)].m}
function humanTurn(){return mode==="two"||turn===human}
function say(s){$("msg").textContent=s}
function finish(r){done=true;chosen=null;say(r==="draw"?"引き分けです":r+"の勝利です")}
function render(){let el=$("board");el.innerHTML="";let legal=chosen===null?[]:moves(b,turn).filter(m=>m.c===chosen);for(let r=0;r<6;r++)for(let c=0;c<6;c++){let q=document.createElement("button");q.className="cell "+((r+c)%2?"dark":"light");if((b.A[c]===r&&r===0)||(b.B[c]===r&&r===5))q.classList.add("goal");if(chosen===c&&b[turn][c]===r)q.classList.add("selected");if(b.A[c]===r){let p=document.createElement("i");p.className="piece a";q.append(p)}else if(b.B[c]===r){let p=document.createElement("i");p.className="piece b";q.append(p)}else if(legal.some(m=>m.c===c&&m.to===r)){let p=document.createElement("i");p.className="move";q.append(p)}q.onclick=()=>tap(r,c);el.append(q)}let g=goals(b);$("ga").textContent=`目標 ${g.A}/4`;$("gb").textContent=`目標 ${g.B}/4`;$("info").textContent=`手数：${count}　${started&&!done?"手番："+turn:""}`;$("sel").textContent=chosen!==null&&humanTurn()?`選択中：${turn}の${chosen+1}列目`:""}
function tap(r,c){if(!started||done||busy||!humanTurn())return;if(b[turn][c]===r){chosen=chosen===c?null:c;render();return}let m=chosen===null?null:moves(b,turn).find(m=>m.c===chosen&&m.to===r);if(m)play(m)}
function play(m){b=apply(b,turn,m);count++;chosen=null;let res=result(b);if(res){finish(res);render();return}turn=other(turn);if(!moves(b,turn).length){say(turn+"は動けないためパスします");turn=other(turn)}res=result(b);if(res){finish(res);render();return}say(turn+"の番です");render();if(mode==="ai"&&turn!==human)runAI()}
function runAI(){if(done||turn===human)return;busy=true;say("AIが考えています…");render();setTimeout(()=>{let m=aiMove(b,turn);busy=false;if(!m){turn=other(turn);if(!moves(b,turn).length)finish("draw");else say(turn+"の番です");render();return}b=apply(b,turn,m);count++;let res=result(b);if(res){finish(res);render();return}turn=other(turn);if(!moves(b,turn).length){say(turn+"は動けないためパスします");turn=other(turn)}res=result(b);if(res)finish(res);else say(turn+"の番です");render()},100)}
function start(){b={A:Array(6).fill(5),B:Array(6).fill(0)};turn=first;chosen=null;started=true;done=false;busy=false;count=0;seed+=7919;say(first+"が先手です");render();if(mode==="ai"&&turn!==human)runAI()}
function bindGroup(id,key,fn){$(id).onclick=e=>{let t=e.target.closest("button[data-v]");if(!t)return;fn(t.dataset.v);$(id).querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===t))}}
bindGroup("m","mode",v=>{mode=v;$("hs").hidden=mode!=="ai"});bindGroup("h","human",v=>human=v);bindGroup("f","first",v=>first=v);$("start").onclick=start;$("restart").onclick=start;render();
</script></body></html>
